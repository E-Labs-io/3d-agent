<?xml version="1.0" encoding="UTF-8"?>
<!-- Drone Rocket Mk II — Plan View (top-down through annular intake), scale 1:3 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="ui-monospace, Menlo, monospace" font-size="9">
  <style>
    .visible { stroke: #111; stroke-width: 0.7; fill: none; }
    .hidden  { stroke: #888; stroke-width: 0.35; fill: none; stroke-dasharray: 3,2; }
    .center  { stroke: #c33; stroke-width: 0.25; fill: none; stroke-dasharray: 6,2,1,2; }
    .dim     { stroke: #555; stroke-width: 0.25; fill: none; }
    .dim-arrow { fill: #555; }
    .label   { fill: #111; }
    .note    { fill: #444; font-size: 8; font-style: italic; }
    .accent  { fill: #cc2200; }
    .strut   { fill: #666; stroke: #333; stroke-width: 0.3; }
    .column  { fill: #d0d0d8; stroke: #333; stroke-width: 0.4; }
    .title   { font-size: 11; font-weight: bold; fill: #111; }
    .titleblock { stroke: #111; stroke-width: 0.7; fill: #fafaf6; }
    .axis-label { font-size: 10; font-weight: bold; }
  </style>

  <rect width="800" height="800" fill="#fefefa"/>

  <text x="400" y="30" text-anchor="middle" class="title">DRONE ROCKET Mk II — PLAN VIEW (looking down through intake at y=840)</text>
  <text x="400" y="45" text-anchor="middle" class="note">Scale 1:3  |  All dims mm  |  Axes: +X right, +Z up the page (forward), +Y out of page</text>

  <!-- Centre at SVG (400, 400). Scale: 1mm = 1 SVG unit so a Ø150 circle = 150 px diameter -->
  <g transform="translate(400 400)">
    <!-- Outer body OD -->
    <circle class="visible" cx="0" cy="0" r="75"/>
    <!-- Inner duct -->
    <circle class="visible" cx="0" cy="0" r="70"/>
    <!-- Avionics column OD -->
    <circle class="column" cx="0" cy="0" r="25"/>
    <!-- Avionics column ID -->
    <circle class="hidden" cx="0" cy="0" r="20"/>

    <!-- Centre cross -->
    <line class="center" x1="-90" y1="0" x2="90" y2="0"/>
    <line class="center" x1="0" y1="-90" x2="0" y2="90"/>

    <!-- 6 Annular intake struts (60° apart, 8mm wide × radial 5mm thick) -->
    <g>
      <!-- Strut at 0° (right) -->
      <rect class="strut" x="68" y="-4" width="-7" height="8"/>
      <!-- 60° -->
      <g transform="rotate(60)"><rect class="strut" x="68" y="-4" width="-7" height="8"/></g>
      <!-- 120° -->
      <g transform="rotate(120)"><rect class="strut" x="68" y="-4" width="-7" height="8"/></g>
      <!-- 180° -->
      <g transform="rotate(180)"><rect class="strut" x="68" y="-4" width="-7" height="8"/></g>
      <!-- 240° -->
      <g transform="rotate(240)"><rect class="strut" x="68" y="-4" width="-7" height="8"/></g>
      <!-- 300° -->
      <g transform="rotate(300)"><rect class="strut" x="68" y="-4" width="-7" height="8"/></g>
    </g>

    <!-- Pitot tube (centred) -->
    <circle class="visible" cx="0" cy="0" r="1.6" fill="#888"/>
    <text x="3" y="2" class="note">pitot</text>

    <!-- Hidden: canard locations at y=550 (45° offsets from tail fins) -->
    <g stroke="#888" stroke-width="0.35" stroke-dasharray="3,2" fill="none">
      <line x1="0" y1="0" x2="60" y2="60"/>
      <line x1="0" y1="0" x2="-60" y2="60"/>
      <line x1="0" y1="0" x2="-60" y2="-60"/>
      <line x1="0" y1="0" x2="60" y2="-60"/>
    </g>

    <!-- Hidden: tail fin locations at y=140 (0/90/180/270 — N/E/S/W) -->
    <g stroke="#888" stroke-width="0.35" stroke-dasharray="6,2" fill="none">
      <line x1="0" y1="0" x2="85" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="85"/>
      <line x1="0" y1="0" x2="-85" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="-85"/>
    </g>

    <!-- Axis labels -->
    <text x="100" y="3" class="axis-label">+X</text>
    <text x="0" y="-95" text-anchor="middle" class="axis-label">+Z (fwd)</text>
    <text x="-100" y="3" text-anchor="end" class="axis-label">-X</text>
    <text x="0" y="105" text-anchor="middle" class="axis-label">-Z</text>

    <!-- Strut callout -->
    <text x="68" y="-10" text-anchor="middle" class="note">strut 1 of 6</text>

    <!-- Canard / fin orientation legend -->
    <text x="48" y="-50" text-anchor="middle" class="note" font-size="7">Canard 1 (45°)</text>
    <text x="62" y="3" class="note" font-size="7">Tail fin E (0°)</text>
  </g>

  <!-- Dimensions -->
  <g transform="translate(400 400)">
    <!-- Ø150 body OD -->
    <line class="dim" x1="-130" y1="-95" x2="-130" y2="-75"/>
    <line class="dim" x1="-130" y1="95" x2="-130" y2="75"/>
    <line class="dim" x1="-130" y1="-90" x2="-130" y2="90"/>
    <polygon class="dim-arrow" points="-130,-90 -133,-82 -127,-82"/>
    <polygon class="dim-arrow" points="-130,90 -133,82 -127,82"/>
    <text x="-135" y="3" text-anchor="end" class="label">Ø150</text>

    <!-- Ø50 column OD -->
    <line class="dim" x1="-25" y1="40" x2="25" y2="40"/>
    <line class="dim" x1="-25" y1="42" x2="-25" y2="32"/>
    <line class="dim" x1="25" y1="42" x2="25" y2="32"/>
    <text x="0" y="55" text-anchor="middle" class="label">Ø50</text>
    <text x="0" y="65" text-anchor="middle" class="note">central column</text>

    <!-- Annular flow gap callout -->
    <line class="dim" x1="25" y1="-50" x2="70" y2="-50"/>
    <line class="dim" x1="25" y1="-48" x2="25" y2="-58"/>
    <line class="dim" x1="70" y1="-48" x2="70" y2="-58"/>
    <text x="48" y="-55" text-anchor="middle" class="label">45</text>
    <text x="48" y="-65" text-anchor="middle" class="note">flow gap</text>

    <!-- 60° between struts -->
    <path class="dim" d="M 38 -22 A 44 44 0 0 1 44 -7"/>
    <text x="50" y="-15" class="label">60°</text>

    <!-- Strut size -->
    <line class="dim" x1="68" y1="-12" x2="68" y2="-30"/>
    <line class="dim" x1="61" y1="-12" x2="61" y2="-30"/>
    <line class="dim" x1="68" y1="-25" x2="61" y2="-25"/>
    <text x="64" y="-32" text-anchor="middle" class="label">8</text>
    <text x="64" y="-40" text-anchor="middle" class="note">strut chord</text>
  </g>

  <!-- Section indicators -->
  <g transform="translate(400 400)">
    <!-- A-A section line (front-back) -->
    <line stroke="#c33" stroke-width="0.6" x1="0" y1="-130" x2="0" y2="130" stroke-dasharray="10,3"/>
    <text x="0" y="-140" text-anchor="middle" fill="#c33" font-size="11" font-weight="bold">A</text>
    <text x="0" y="148" text-anchor="middle" fill="#c33" font-size="11" font-weight="bold">A</text>
    <polygon fill="#c33" points="-5,-127 5,-127 0,-119"/>
    <polygon fill="#c33" points="-5,127 5,127 0,135"/>
  </g>

  <!-- Notes -->
  <g transform="translate(40 540)" font-size="9" fill="#111">
    <text class="title" font-size="10">NOTES:</text>
    <text y="18">1. Plan view taken at y=840 (mid-intake) showing 6 annular struts.</text>
    <text y="32">2. Hidden lines: control surface positions projected onto plan.</text>
    <text y="46">3. Tail fins at 0/90/180/270° (cardinal); canards offset 45° (interleaved).</text>
    <text y="60">4. Section A-A through ±X axis is drawn as DRG 02.</text>
    <text y="74">5. Pitot tube projects 28mm above the plane shown.</text>
  </g>

  <!-- Title block -->
  <g transform="translate(540 710)">
    <rect class="titleblock" width="240" height="80"/>
    <line x1="0" y1="20" x2="240" y2="20" stroke="#111" stroke-width="0.4"/>
    <line x1="0" y1="40" x2="240" y2="40" stroke="#111" stroke-width="0.4"/>
    <line x1="0" y1="60" x2="240" y2="60" stroke="#111" stroke-width="0.4"/>
    <line x1="120" y1="20" x2="120" y2="80" stroke="#111" stroke-width="0.4"/>

    <text x="120" y="14" text-anchor="middle" class="title">DRONE ROCKET Mk II</text>
    <text x="60" y="34" text-anchor="middle" class="label">DRG 03</text>
    <text x="180" y="34" text-anchor="middle" class="label">PLAN VIEW</text>
    <text x="60" y="54" text-anchor="middle" class="label">SCALE 1:3</text>
    <text x="180" y="54" text-anchor="middle" class="label">2026-05-03</text>
    <text x="60" y="74" text-anchor="middle" class="note">Drawn by 3D Agent</text>
    <text x="180" y="74" text-anchor="middle" class="note">Sheet 3 of 6</text>
  </g>
</svg>
