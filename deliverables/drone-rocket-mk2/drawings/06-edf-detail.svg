<?xml version="1.0" encoding="UTF-8"?>
<!-- Drone Rocket Mk II — Contra-Rotating EDF Detail, scale 2:1 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" font-family="ui-monospace, Menlo, monospace" font-size="9">
  <style>
    .visible { stroke: #111; stroke-width: 0.7; fill: none; }
    .hidden  { stroke: #888; stroke-width: 0.35; fill: none; stroke-dasharray: 3,2; }
    .center  { stroke: #c33; stroke-width: 0.25; fill: none; stroke-dasharray: 6,2,1,2; }
    .dim     { stroke: #555; stroke-width: 0.25; fill: none; }
    .dim-arrow { fill: #555; }
    .label   { fill: #111; }
    .note    { fill: #444; font-size: 8; font-style: italic; }
    .duct    { fill: #1a1a20; stroke: #111; stroke-width: 0.4; }
    .motor   { fill: #2a2a32; stroke: #111; stroke-width: 0.5; }
    .strut   { fill: #888; stroke: #333; stroke-width: 0.4; }
    .rotor   { fill: #1a1a20; stroke: #111; stroke-width: 0.4; }
    .spinner { fill: #cc2200; stroke: #aa1500; stroke-width: 0.4; }
    .stator  { fill: #b0b0b8; stroke: #444; stroke-width: 0.4; }
    .accent  { fill: #cc2200; }
    .title   { font-size: 11; font-weight: bold; fill: #111; }
    .titleblock { stroke: #111; stroke-width: 0.7; fill: #fafaf6; }
    .arrow-cw { fill: none; stroke: #c33; stroke-width: 1.2; }
    .arrow-ccw { fill: none; stroke: #1a6acc; stroke-width: 1.2; }
  </style>

  <rect width="800" height="1100" fill="#fefefa"/>

  <text x="400" y="30" text-anchor="middle" class="title">DRONE ROCKET Mk II — CONTRA-ROTATING EDF DETAIL</text>
  <text x="400" y="48" text-anchor="middle" class="note">Scale 2:1  |  All dims mm  |  Section through Y axis showing both stages</text>

  <!-- ===== LEFT: cross-section view of stacked EDF ===== -->
  <g transform="translate(280 580)">
    <!-- Outer body shell (Section 4 boundary) -->
    <rect class="visible" x="-150" y="-300" width="300" height="600" fill="none"/>
    <text x="-145" y="-292" class="note">Section 4 body shell (Ø150 OD)</text>

    <!-- Inner duct liner (Ø140 ID) -->
    <rect class="duct" x="-140" y="-300" width="280" height="600" fill="#1a1a2050" stroke="#444"/>
    <line class="visible" x1="-140" y1="-300" x2="-140" y2="300"/>
    <line class="visible" x1="140" y1="-300" x2="140" y2="300"/>

    <!-- Centre line -->
    <line class="center" x1="0" y1="-310" x2="0" y2="310"/>

    <!-- ============ UPPER EDF (CW) at top ============ -->
    <!-- Stator vanes (above rotor) -->
    <g transform="translate(0 -230)">
      <rect class="stator" x="-86" y="0" width="172" height="8"/>
      <!-- 11 vanes shown as inset lines -->
      <g stroke="#444" stroke-width="0.3">
        <line x1="-80" y1="0" x2="-80" y2="8"/>
        <line x1="-65" y1="0" x2="-65" y2="8"/>
        <line x1="-50" y1="0" x2="-50" y2="8"/>
        <line x1="-35" y1="0" x2="-35" y2="8"/>
        <line x1="-20" y1="0" x2="-20" y2="8"/>
        <line x1="-5" y1="0" x2="-5" y2="8"/>
        <line x1="10" y1="0" x2="10" y2="8"/>
        <line x1="25" y1="0" x2="25" y2="8"/>
        <line x1="40" y1="0" x2="40" y2="8"/>
        <line x1="55" y1="0" x2="55" y2="8"/>
        <line x1="70" y1="0" x2="70" y2="8"/>
      </g>
      <text x="-95" y="4" text-anchor="end" class="note">11× stator</text>
    </g>

    <!-- Upper rotor (cross-section: blades shown as slanted strokes) -->
    <g transform="translate(0 -180)">
      <!-- Hub spinner -->
      <ellipse class="spinner" cx="0" cy="0" rx="24" ry="24"/>
      <!-- 7 blades visible as slanted lines on each side -->
      <g class="rotor" stroke-width="2">
        <!-- left side blades (3 visible at this angle) -->
        <line x1="-24" y1="0" x2="-86" y2="-15"/>
        <line x1="-24" y1="-8" x2="-86" y2="-25"/>
        <line x1="-24" y1="8" x2="-86" y2="-5"/>
        <!-- right side blades -->
        <line x1="24" y1="0" x2="86" y2="15"/>
        <line x1="24" y1="-8" x2="86" y2="25"/>
        <line x1="24" y1="8" x2="86" y2="5"/>
      </g>
      <text x="-95" y="0" text-anchor="end" class="note">7× rotor (CW)</text>
    </g>

    <!-- Upper motor pod -->
    <g transform="translate(0 -130)">
      <ellipse class="motor" cx="0" cy="0" rx="27" ry="42"/>
      <rect class="accent" x="-3" y="-44" width="6" height="6"/>
      <text x="-3" y="0" class="note">CW motor</text>
      <text x="-3" y="10" class="note" font-size="7">MN3110</text>
    </g>

    <!-- Upper motor mount struts (4) -->
    <g transform="translate(0 -88)">
      <line class="strut" x1="-86" y1="0" x2="-27" y2="0" stroke-width="3"/>
      <line class="strut" x1="86" y1="0" x2="27" y2="0" stroke-width="3"/>
      <text x="-95" y="2" text-anchor="end" class="note">4× strut</text>
    </g>

    <!-- ============ MIDDLE: spacer / wire routing ============ -->
    <line class="hidden" x1="-86" y1="-50" x2="86" y2="-50"/>
    <line class="hidden" x1="-86" y1="50" x2="86" y2="50"/>
    <text x="-95" y="0" text-anchor="end" class="note">spacer 80</text>

    <!-- ============ LOWER EDF (CCW) at bottom ============ -->
    <!-- Lower motor mount struts (4) -->
    <g transform="translate(0 88)">
      <line class="strut" x1="-86" y1="0" x2="-27" y2="0" stroke-width="3"/>
      <line class="strut" x1="86" y1="0" x2="27" y2="0" stroke-width="3"/>
    </g>

    <!-- Lower motor pod (mirrored) -->
    <g transform="translate(0 130)">
      <ellipse class="motor" cx="0" cy="0" rx="27" ry="42"/>
      <rect class="accent" x="-3" y="38" width="6" height="6"/>
      <text x="-3" y="0" class="note">CCW motor</text>
      <text x="-3" y="10" class="note" font-size="7">MN3110-rev</text>
    </g>

    <!-- Lower rotor -->
    <g transform="translate(0 180)">
      <ellipse class="spinner" cx="0" cy="0" rx="24" ry="24"/>
      <g class="rotor" stroke-width="2">
        <!-- Mirrored blade orientation -->
        <line x1="-24" y1="0" x2="-86" y2="15"/>
        <line x1="-24" y1="-8" x2="-86" y2="5"/>
        <line x1="-24" y1="8" x2="-86" y2="25"/>
        <line x1="24" y1="0" x2="86" y2="-15"/>
        <line x1="24" y1="-8" x2="86" y2="-5"/>
        <line x1="24" y1="8" x2="86" y2="-25"/>
      </g>
      <text x="-95" y="0" text-anchor="end" class="note">7× rotor (CCW)</text>
    </g>

    <!-- Lower stator vanes -->
    <g transform="translate(0 230)">
      <rect class="stator" x="-86" y="-8" width="172" height="8"/>
      <g stroke="#444" stroke-width="0.3">
        <line x1="-80" y1="-8" x2="-80" y2="0"/>
        <line x1="-65" y1="-8" x2="-65" y2="0"/>
        <line x1="-50" y1="-8" x2="-50" y2="0"/>
        <line x1="-35" y1="-8" x2="-35" y2="0"/>
        <line x1="-20" y1="-8" x2="-20" y2="0"/>
        <line x1="-5" y1="-8" x2="-5" y2="0"/>
        <line x1="10" y1="-8" x2="10" y2="0"/>
        <line x1="25" y1="-8" x2="25" y2="0"/>
        <line x1="40" y1="-8" x2="40" y2="0"/>
        <line x1="55" y1="-8" x2="55" y2="0"/>
        <line x1="70" y1="-8" x2="70" y2="0"/>
      </g>
    </g>

    <!-- Rotation arrows -->
    <g transform="translate(105 -180)">
      <path class="arrow-cw" d="M 0 0 A 18 18 0 1 0 0.001 0"/>
      <polygon fill="#c33" points="-5,-15 5,-15 0,-22"/>
      <text x="0" y="35" text-anchor="middle" fill="#c33" font-size="10" font-weight="bold">CW</text>
    </g>
    <g transform="translate(105 180)">
      <path class="arrow-ccw" d="M 0 0 A 18 18 0 1 1 0.001 0"/>
      <polygon fill="#1a6acc" points="-5,15 5,15 0,22"/>
      <text x="0" y="-25" text-anchor="middle" fill="#1a6acc" font-size="10" font-weight="bold">CCW</text>
    </g>

    <!-- Airflow arrows -->
    <g transform="translate(-115 -250)">
      <line stroke="#0a8" stroke-width="1.2" x1="0" y1="0" x2="0" y2="500"/>
      <polygon fill="#0a8" points="-4,495 4,495 0,505"/>
      <text x="0" y="-10" text-anchor="middle" fill="#0a8" font-size="9" font-weight="bold">flow</text>
    </g>

  </g>

  <!-- ============ DIMENSIONS ============ -->
  <g transform="translate(280 580)">
    <!-- 200mm section height -->
    <line class="dim" x1="170" y1="-300" x2="200" y2="-300"/>
    <line class="dim" x1="170" y1="300" x2="200" y2="300"/>
    <line class="dim" x1="190" y1="-300" x2="190" y2="300"/>
    <polygon class="dim-arrow" points="190,-300 187,-292 193,-292"/>
    <polygon class="dim-arrow" points="190,300 187,292 193,292"/>
    <text x="205" y="0" class="label">200</text>

    <!-- 80mm spacer between fans -->
    <line class="dim" x1="100" y1="-50" x2="100" y2="50"/>
    <text x="105" y="0" class="label">80</text>
    <text x="105" y="12" class="note">spacer</text>

    <!-- Ø140 duct ID -->
    <line class="dim" x1="-140" y1="-280" x2="140" y2="-280"/>
    <text x="0" y="-285" text-anchor="middle" class="label">Ø140 ID</text>

    <!-- Rotor swept dia -->
    <line class="dim" x1="-86" y1="280" x2="86" y2="280"/>
    <text x="0" y="295" text-anchor="middle" class="label">Ø172 rotor swept</text>

    <!-- Hub Ø48 -->
    <line class="dim" x1="-24" y1="-150" x2="24" y2="-150"/>
    <line class="dim" x1="-24" y1="-148" x2="-24" y2="-160"/>
    <line class="dim" x1="24" y1="-148" x2="24" y2="-160"/>
    <text x="0" y="-165" text-anchor="middle" class="label">Ø48</text>
    <text x="0" y="-175" text-anchor="middle" class="note">spinner / hub</text>
  </g>

  <!-- ===== RIGHT: rotor blade detail ===== -->
  <g transform="translate(640 200)">
    <text x="0" y="-15" text-anchor="middle" class="title" font-size="10">ROTOR DETAIL — 7-blade CW</text>

    <!-- Top-down view of rotor -->
    <circle class="visible" cx="0" cy="100" r="65"/>
    <circle class="spinner" cx="0" cy="100" r="22"/>

    <!-- 7 blades radial -->
    <g transform="translate(0 100)">
      <g transform="rotate(0)"><path class="rotor" d="M 22 -2 L 65 -8 L 65 4 L 22 2 Z"/></g>
      <g transform="rotate(51.4)"><path class="rotor" d="M 22 -2 L 65 -8 L 65 4 L 22 2 Z"/></g>
      <g transform="rotate(102.8)"><path class="rotor" d="M 22 -2 L 65 -8 L 65 4 L 22 2 Z"/></g>
      <g transform="rotate(154.3)"><path class="rotor" d="M 22 -2 L 65 -8 L 65 4 L 22 2 Z"/></g>
      <g transform="rotate(205.7)"><path class="rotor" d="M 22 -2 L 65 -8 L 65 4 L 22 2 Z"/></g>
      <g transform="rotate(257.1)"><path class="rotor" d="M 22 -2 L 65 -8 L 65 4 L 22 2 Z"/></g>
      <g transform="rotate(308.6)"><path class="rotor" d="M 22 -2 L 65 -8 L 65 4 L 22 2 Z"/></g>
    </g>

    <!-- Rotation arrow -->
    <path class="arrow-cw" d="M -75 100 A 75 75 0 0 1 75 100" stroke-width="1.5"/>
    <polygon fill="#c33" points="68,98 75,108 80,98"/>
    <text x="0" y="195" text-anchor="middle" fill="#c33" font-weight="bold">CW rotation</text>
  </g>

  <!-- Stator detail -->
  <g transform="translate(640 460)">
    <text x="0" y="-15" text-anchor="middle" class="title" font-size="10">STATOR DETAIL — 11 vanes</text>
    <circle class="visible" cx="0" cy="100" r="65"/>
    <circle class="visible" cx="0" cy="100" r="24" fill="#fff"/>
    <g transform="translate(0 100)">
      <g transform="rotate(0)"><rect class="stator" x="24" y="-1" width="41" height="2"/></g>
      <g transform="rotate(32.7)"><rect class="stator" x="24" y="-1" width="41" height="2"/></g>
      <g transform="rotate(65.5)"><rect class="stator" x="24" y="-1" width="41" height="2"/></g>
      <g transform="rotate(98.2)"><rect class="stator" x="24" y="-1" width="41" height="2"/></g>
      <g transform="rotate(130.9)"><rect class="stator" x="24" y="-1" width="41" height="2"/></g>
      <g transform="rotate(163.6)"><rect class="stator" x="24" y="-1" width="41" height="2"/></g>
      <g transform="rotate(196.4)"><rect class="stator" x="24" y="-1" width="41" height="2"/></g>
      <g transform="rotate(229.1)"><rect class="stator" x="24" y="-1" width="41" height="2"/></g>
      <g transform="rotate(261.8)"><rect class="stator" x="24" y="-1" width="41" height="2"/></g>
      <g transform="rotate(294.5)"><rect class="stator" x="24" y="-1" width="41" height="2"/></g>
      <g transform="rotate(327.3)"><rect class="stator" x="24" y="-1" width="41" height="2"/></g>
    </g>
    <text x="0" y="195" text-anchor="middle" class="note">Anti-swirl, fixed (no rotation)</text>
  </g>

  <!-- Mount strut detail -->
  <g transform="translate(640 720)">
    <text x="0" y="-15" text-anchor="middle" class="title" font-size="10">MOUNT STRUT — 4× per stage</text>
    <circle class="visible" cx="0" cy="100" r="65"/>
    <circle class="motor" cx="0" cy="100" r="22"/>
    <g transform="translate(0 100)">
      <g transform="rotate(45)"><rect class="strut" x="22" y="-2" width="43" height="4"/></g>
      <g transform="rotate(135)"><rect class="strut" x="22" y="-2" width="43" height="4"/></g>
      <g transform="rotate(225)"><rect class="strut" x="22" y="-2" width="43" height="4"/></g>
      <g transform="rotate(315)"><rect class="strut" x="22" y="-2" width="43" height="4"/></g>
    </g>
    <text x="0" y="195" text-anchor="middle" class="note">PA-CF, load path: rotor → motor → struts → duct</text>
  </g>

  <!-- Performance notes -->
  <g transform="translate(40 980)">
    <text class="title" font-size="10">PERFORMANCE PER STAGE:</text>
    <text y="14" font-size="9">• Static thrust (per EDF):  2.3 kg-f @ 22.2 V, 32 A peak</text>
    <text y="26" font-size="9">• Tip speed:  ~85 m/s @ 9,500 rpm  (Ma ≈ 0.25, well below tip-stall)</text>
    <text y="38" font-size="9">• Pressure rise:  ~1,500 Pa  (low-pressure ratio fan, optimised for axial flow)</text>
    <text y="50" font-size="9">• Combined thrust:  4.6 kg-f  (1.92 T:W at 2.4 kg AUW)</text>
    <text y="62" font-size="9">• Net torque:  ≈ 0 N·m  (CW + CCW cancel, residual ≤ 0.05 N·m for trim authority)</text>
  </g>

  <!-- Title block -->
  <g transform="translate(540 1010)">
    <rect class="titleblock" width="240" height="80"/>
    <line x1="0" y1="20" x2="240" y2="20" stroke="#111" stroke-width="0.4"/>
    <line x1="0" y1="40" x2="240" y2="40" stroke="#111" stroke-width="0.4"/>
    <line x1="0" y1="60" x2="240" y2="60" stroke="#111" stroke-width="0.4"/>
    <line x1="120" y1="20" x2="120" y2="80" stroke="#111" stroke-width="0.4"/>

    <text x="120" y="14" text-anchor="middle" class="title">DRONE ROCKET Mk II</text>
    <text x="60" y="34" text-anchor="middle" class="label">DRG 06</text>
    <text x="180" y="34" text-anchor="middle" class="label">EDF DETAIL</text>
    <text x="60" y="54" text-anchor="middle" class="label">SCALE 2:1</text>
    <text x="180" y="54" text-anchor="middle" class="label">2026-05-03</text>
    <text x="60" y="74" text-anchor="middle" class="note">Drawn by 3D Agent</text>
    <text x="180" y="74" text-anchor="middle" class="note">Sheet 6 of 6</text>
  </g>
</svg>
